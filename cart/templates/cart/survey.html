{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
  <h3>{{ template_data.title }}</h3>
  <p class="text-muted">Order #{{ template_data.order.id }}</p>

  <div class="card">
    <div class="card-body">
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Name (optional)</label>
          {{ template_data.form.name }}
        </div>
        <div class="mb-3">
          <label class="form-label">Short statement</label>
          {{ template_data.form.message }}
        </div>
        <div class="form-check mb-3">
          {{ template_data.form.anonymous }} <label class="form-check-label">Post anonymously</label>
        </div>
        <button class="btn btn-primary" type="submit">Submit</button>
        <a class="btn btn-secondary ms-2" href="{% url 'movies_index' %}">Cancel</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
